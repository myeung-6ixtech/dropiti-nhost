# Dropiti Nhost — local + cloud config
# Secrets: repo-root `.secrets` (local) or Dashboard → Secrets (cloud).
# See: documentation/AI_Rules.md

[functions.node]
version = 22

[hasura]
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'

[[hasura.jwtSecrets]]
type = 'HS256'
key = '{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}'
