# Dropiti Nhost — local + cloud config
# Secrets: repo-root `.secrets` file (local CLI) — template in `secrets/dotsecrets.example`.
# See: secrets/README.md and documentation/AI_Rules.md

# --- Auth: dropiti-v3 (client app) redirect URLs ---
# clientUrl     — Nhost "Client URL" (prod). Used for default redirects (password reset, etc.).
# allowedUrls   — Nhost "Allowed Redirect URLs". OAuth signInWithGoogle uses bare
#                 window.location.origin — must match an entry exactly (no trailing slash).
# Ref: dropiti-v3/documentation/google-auth.md Rules 2–3
#
# Google Cloud Console "Authorized redirect URI" (OAuth provider callback — set in GCP, not here):
#   https://fcuycyemqprjrkbshlcj.auth.ap-southeast-1.nhost.run/v1/signin/provider/google/callback
[auth]
[auth.redirections]
clientUrl = 'https://dropiti.com'
allowedUrls = [
  'http://localhost:3000',
  'http://localhost:3001',
  'http://127.0.0.1:3000',
  'https://dropiti.com',
  'https://www.dropiti.com',
  'https://*.vercel.app',
  'http://localhost:3000/auth/user-verification',
  'http://localhost:3000/reset-password',
  'https://dropiti.com/auth/user-verification',
  'https://dropiti.com/reset-password',
]

# --- Mailgun SMTP (Nhost Auth transactional emails: verify, password reset, OTP) ---
# REQUIRES cloud secret MAILGUN_SMTP_PASSWORD before deploy (Dashboard → Settings → Secrets).
# Local: repo-root `.secrets` — see secrets/README.md and secrets/dotsecrets.example.
# Port 587 uses STARTTLS — keep secure = false (see Nhost / nodemailer docs).
[provider.smtp]
host = 'smtp.mailgun.org'
port = 587
user = 'support-dropiti@6ixtech.xyz'
password = '{{ secrets.MAILGUN_SMTP_PASSWORD }}'
sender = 'support-dropiti@6ixtech.xyz'
secure = false
method = 'LOGIN'

[functions.node]
version = 22

# Optional: comma-separated UUIDs for admin incoming-offers recipient filter (see _lib/admin-incoming-offers.ts)
[[global.environment]]
name = 'DROPITI_PLATFORM_LANDLORD_USER_IDS'
value = ''

# Nhost Storage — admin media (`dropiti-bucket`); preferred over S3 when subdomain/region are set.
[[global.environment]]
name = 'MEDIA_STORAGE_BUCKET'
value = '{{ secrets.MEDIA_STORAGE_BUCKET }}'

# Optional: force backend — `nhost` | `s3` (default: nhost when storage URL resolves, else s3)
# [[global.environment]]
# name = 'MEDIA_STORAGE_BACKEND'
# value = 'nhost'

# AWS S3 — fallback when Nhost Storage is unavailable
[[global.environment]]
name = 'S3_BUCKET_ACCESS_KEY'
value = '{{ secrets.S3_BUCKET_ACCESS_KEY }}'

[[global.environment]]
name = 'S3_BUCKET_SECRET_KEY'
value = '{{ secrets.S3_BUCKET_SECRET_KEY }}'

[[global.environment]]
name = 'S3_BUCKET_NAME'
value = '{{ secrets.S3_BUCKET_NAME }}'

[[global.environment]]
name = 'S3_BUCKET_AWS_REGION'
value = 'ap-northeast-2'

[hasura]
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'

[[hasura.jwtSecrets]]
type = 'HS256'
key = '{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}'

# Required for cloud deploy: replaceConfig rejects null postgres (ConfigPostgresInsertInput).
# Pin version to match Nhost-supported images; run `nhost config pull` if deploy rejects the tag.
# https://github.com/nhost/nhost/blob/main/cli/examples/myproject/nhost/nhost.toml
[postgres]
version = '14.20-20251217-1'

[postgres.resources.storage]
capacity = 1

# Required for cloud deploy: replaceConfig rejects null observability (ConfigObservabilityInsertInput).
# https://github.com/nhost/nhost/blob/main/cli/examples/myproject/nhost/nhost.toml
[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'
